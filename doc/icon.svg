<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="zfs-ncdu">
  <title>zfs-ncdu</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0c1017"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#34b3e0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="109" fill="none" stroke="#3a4557" stroke-width="8"/>

  <!-- A Z built from usage bars: the letter reads as ZFS, the bars as ncdu's
       size graph, with the unfilled remainder shown dim as ncdu draws it. -->
  <g>
    <rect x="112" y="136" width="216" height="46" rx="10" fill="url(#fill)"/>
    <rect x="336" y="136" width="64" height="46" rx="10" fill="#33414f"/>

    <path d="M330 190 L242 322 L168 322 L256 190 Z" fill="url(#fill)" opacity="0.92"/>

    <rect x="112" y="330" width="150" height="46" rx="10" fill="url(#fill)"/>
    <rect x="270" y="330" width="60" height="46" rx="10" fill="#4a6d5c"/>
    <rect x="338" y="330" width="62" height="46" rx="10" fill="#33414f"/>
  </g>
</svg>
